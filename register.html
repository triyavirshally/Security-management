<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - AI Belonging Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">
    <div class="card bg-secondary p-4 shadow-lg border-0 style-card" style="width: 380px;">
        <h4 class="text-center fw-bold mb-3">Hostel Security Register</h4>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="regUsername" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Hostel Email</label>
                <input type="email" class="form-control bg-dark text-white border-secondary" id="regEmail" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control bg-dark text-white border-secondary" id="regPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Register Account</button>
            <p class="mt-3 text-center small text-muted">Already registered? <a href="/login" class="text-info">Login here</a></p>
        </form>
    </div>
</body>
</html>
